<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GTA VI · 欢迎来到莱昂尼达</title>
  <link rel="stylesheet" href="style.css">
  <script src="effects-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wallpaper" aria-label="GTA VI 发售日倒计时壁纸">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="characters" id="characters" aria-hidden="true"></div>
    <div class="logo-glow" aria-hidden="true">
      <div class="logo-glow__aura"></div><div class="logo-glow__halo"></div><div class="logo-glow__edge"></div>
      <svg class="logo-sparkles" viewBox="0 0 3840 2160" aria-hidden="true">
        <defs>
          <g id="logo-star"><path d="M0-19 2.6-2.6 19 0 2.6 2.6 0 19-2.6 2.6-19 0-2.6-2.6Z"/><path class="logo-star__diagonal" d="M0-10 1.5-1.5 10 0 1.5 1.5 0 10-1.5 1.5-10 0-1.5-1.5Z" transform="rotate(45)"/><circle r="2.5"/></g>
        </defs>
        <g class="logo-sparkle" transform="translate(247 210)" style="--delay:-.3s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(393 207)" style="--delay:-1.1s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(534 213)" style="--delay:-2.2s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(789 207)" style="--delay:-3.1s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(951 207)" style="--delay:-4.3s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1088 210)" style="--delay:-5.4s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1372 211)" style="--delay:-1.7s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1372 486)" style="--delay:-2.7s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1372 800)" style="--delay:-3.7s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1372 1049)" style="--delay:-4.7s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1227 1051)" style="--delay:-5.7s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(1088 1049)" style="--delay:-.8s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(654 1049)" style="--delay:-2s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(582 901)" style="--delay:-3.2s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(485 701)" style="--delay:-4.4s"><use href="#logo-star"/></g>
        <g class="logo-sparkle" transform="translate(339 400)" style="--delay:-5.6s"><use href="#logo-star"/></g>
      </svg>
    </div>
    <div class="readability" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>
    <canvas class="dust" id="particles" aria-hidden="true"></canvas>

    <aside class="clock" id="clock" aria-label="北京时间">
      <div class="clock__time" id="clock-time">00:00</div>
      <div class="clock__date" id="clock-date">10月15日 星期四</div>
      <div class="clock__zone">BEIJING · UTC+8</div>
    </aside>

    <section class="countdown" id="countdown" aria-label="距离计划发售日">
      <p class="countdown__intro" id="intro">欢迎来到莱昂尼达，还有</p>
      <div class="digits" role="timer" aria-live="off">
        <div class="digit"><span class="digit__number" id="days">00</span><span class="digit__label">天</span></div>
        <div class="digit"><span class="digit__number" id="hours">00</span><span class="digit__label">时</span></div>
        <div class="digit"><span class="digit__number" id="minutes">00</span><span class="digit__label">分</span></div>
        <div class="digit"><span class="digit__number" id="seconds">00</span><span class="digit__label">秒</span></div>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-label="自首支预告公布起的等待进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
      <p class="countdown__progress" id="progress-text">已完成 0.0%</p>
      <p class="countdown__target" id="target-date">2026年11月19日 — 00:00 GMT+8</p>
      <p class="countdown__note" id="target-note">港区 PS5 · PS Store 列示时间</p>
    </section>
  </main>
</body>
</html>
