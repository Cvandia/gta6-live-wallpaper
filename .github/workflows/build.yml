name: Build Windows wallpaper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-wallpaper-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen --group build

      - name: Run Python unit tests
        run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Web tests
        run: |
          node tests/test_web.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Web countdown tests failed' }
          node tests/test_web_effects.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Web effects tests failed' }

      - name: Build EXE and ZIP packages
        run: ./build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-LiveWallpaper-Windows-v1.1.0
          path: |
            dist/GTA6Wallpaper.exe
            dist/GTA6-LiveWallpaper-v1.1.0.zip
            dist/GTA6-WallpaperEngine-Web-v1.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish first v1.1.0 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = 'v1.1.0'
          $tagRefs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$releaseTag" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw '无法确认已有发布标签，已停止发布。' }
          if ($tagRefs -contains "refs/tags/$releaseTag") {
            Write-Host "$releaseTag 标签已经存在；保留已有发布和附件。"
            exit 0
          }
          gh release create $releaseTag `
            'dist/GTA6Wallpaper.exe' `
            'dist/GTA6-LiveWallpaper-v1.1.0.zip' `
            'dist/GTA6-WallpaperEngine-Web-v1.1.0.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'GTA VI 动态倒计时壁纸 v1.1.0' `
            --notes-file 'RELEASE_NOTES.md' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 创建失败。' }
